<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soal Matematika Kelas 5 SD</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f1f5f9;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

h1{
text-align:center;
margin-bottom:10px;
color:#1e293b;
}

.info{
text-align:center;
margin-bottom:20px;
color:#64748b;
}

.infoSiswa{
background:#eff6ff;
padding:15px;
border-radius:15px;
margin-bottom:20px;
text-align:center;
}

.infoSiswa h2{
color:#1e3a8a;
margin-bottom:8px;
}

.infoSiswa h3{
color:#475569;
}

.soal{
padding:20px;
border:1px solid #cbd5e1;
border-radius:15px;
margin-top:20px;
}

.soal h3{
margin-bottom:20px;
color:#1e293b;
line-height:1.5;
}

label{
display:block;
padding:12px;
background:#f8fafc;
border-radius:10px;
margin-bottom:12px;
cursor:pointer;
transition:0.3s;
}

label:hover{
background:#dbeafe;
}

button{
width:100%;
padding:15px;
background:#2563eb;
color:white;
border:none;
border-radius:12px;
font-size:16px;
cursor:pointer;
margin-top:20px;
}

button:hover{
background:#1d4ed8;
}

.hasil{
text-align:center;
padding:30px;
}

.nilai{
font-size:60px;
font-weight:bold;
color:#2563eb;
margin:20px 0;
}

.ulang{
background:#dc2626;
}

.ulang:hover{
background:#b91c1c;
}

</style>
</head>

<body>

<div class="container">

<h1>📘 UAS Matematika Kelas 5 SD</h1>

<div class="info">
Semester 2 • Soal HOTS
</div>

<div class="infoSiswa">

<h2 id="namaSiswa"></h2>

<h3 id="kelasSiswa"></h3>

</div>

<form id="quizForm"></form>

</div>

<script>

// ======================
// TAMPILKAN DATA SISWA
// ======================

const nama =
localStorage.getItem("namaSiswa")
|| "Siswa";

const kelas =
localStorage.getItem("kelasSiswa")
|| "Kelas";

document.getElementById("namaSiswa")
.innerHTML =
"👤 " + nama;

document.getElementById("kelasSiswa")
.innerHTML =
"🏫 " + kelas;


// ======================
// TAMPILKAN DATA SISWA
// ======================

const nama =
localStorage.getItem("namaSiswa")
|| "Siswa";

const kelas =
localStorage.getItem("kelasSiswa")
|| "Kelas";

document.getElementById("namaSiswa")
.innerHTML =
"👤 " + nama;

document.getElementById("kelasSiswa")
.innerHTML =
"🏫 " + kelas;
// ======================
// DATA SOAL
// ======================

const soalData = [

{
soal:"1. Hasil dari 2/5 + 1/5 adalah...",
pilihan:["1/5","2/5","3/5","4/5"],
jawaban:"3/5"
},

{
soal:"2. 3/4 × 8 = ...",
pilihan:["4","5","6","7"],
jawaban:"6"
},

{
soal:"3. Volume kubus dengan sisi 5 cm adalah...",
pilihan:["25","50","100","125"],
jawaban:"125"
},

{
soal:"4. Luas persegi panjang panjang 12 cm dan lebar 8 cm adalah...",
pilihan:["20","48","96","120"],
jawaban:"96"
},

{
soal:"5. Hasil 25 × 12 adalah...",
pilihan:["250","275","300","325"],
jawaban:"300"
},

{
soal:"6. 750 : 25 = ...",
pilihan:["25","30","35","40"],
jawaban:"30"
},

{
soal:"7. Pecahan senilai dari 1/2 adalah...",
pilihan:["2/3","2/4","3/5","4/5"],
jawaban:"2/4"
},

{
soal:"8. Keliling persegi sisi 9 cm adalah...",
pilihan:["18","27","36","45"],
jawaban:"36"
},

{
soal:"9. Hasil dari 15² adalah...",
pilihan:["125","200","225","250"],
jawaban:"225"
},

{
soal:"10. 0,75 jika diubah menjadi pecahan adalah...",
pilihan:["1/2","2/3","3/4","4/5"],
jawaban:"3/4"
}

];



// ======================
// QUIZ
// ======================

let nomorSoal = 0;
let benar = 0;

const quizForm =
document.getElementById("quizForm");

tampilkanSoal();

function tampilkanSoal(){

const data = soalData[nomorSoal];

quizForm.innerHTML = `

<div class="soal">

<h3>

${data.soal}

</h3>

${data.pilihan.map(p => `

<label>

<input
type="radio"
name="jawaban"
value="${p}">

${p}

</label>

`).join("")}

<button onclick="lanjutSoal()">

Lanjut

</button>

</div>

`;

}



// ======================
// LANJUT SOAL
// ======================

function lanjutSoal(){

event.preventDefault();

const jawaban =
document.querySelector(
'input[name="jawaban"]:checked'
);

if(!jawaban){

alert(
"Pilih jawaban terlebih dahulu!"
);

return;

}

if(
jawaban.value ===
soalData[nomorSoal].jawaban
){

benar++;

}

nomorSoal++;

if(
nomorSoal <
soalData.length
){

tampilkanSoal();

}else{

selesaiQuiz();

}

}



// ======================
// HASIL QUIZ
// ======================

function selesaiQuiz(){

const nilai =
Math.round(
(benar / soalData.length) * 100
);

quizForm.innerHTML = `

<div class="hasil">

<h2>
Quiz Selesai
</h2>

<div class="nilai">

${nilai}

</div>

<p>

${nilai >= 70

? "🎉 Selamat kamu lulus"

: "❌ Nilai kurang dari 70"}

</p>

${
nilai < 70

?

`

<button
class="ulang"
onclick="location.reload()">

Kerjakan Ulang

</button>

`

: ""

}

</div>

`;



// ======================
// KIRIM GOOGLE SHEET
// ======================

const data = {

nama:nama,

kelas:kelas,

nilai:nilai,

benar:benar,

tanggal:
new Date()
.toLocaleString()

};

fetch(
"https://script.google.com/macros/s/AKfycbwfOsYej4iHwZoYgFLOIoqew2KisHcRtWVVO_WaHZGfDAGWCrSvpNSgFGH2JAcbOKo/exec",
{

method:"POST",

body:JSON.stringify(data)

}

);

}

</script>

</body>
</html>
