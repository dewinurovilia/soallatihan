}

}

}

<div class="info">

<div class="infoSiswa">

},

{

},

{

pilihan:["0,25","0,5","0,75","1"],

},

{
soal:"16. Volume balok p=5 l=4 t=3 adalah...",
pilihan:["60","70","80","90"],

},

soal:"17. Keliling persegi panjang 10 cm dan 5 cm adalah...",

pilihan:["10","11","12","13"],

pilihan:["25","50","75","100"],

// ======================
// QUIZ
// ======================

let nomorSoal = 0;
let benar = 0;

const quizForm =
document.getElementById("quizForm");

tampilkanSoal();

function tampilkanSoal(){

const data = soalData[nomorSoal];

quizForm.innerHTML = `

<div class="soal">

<h3>

${data.soal}

</h3>

${data.pilihan.map(p => `

<label>

<input
type="radio"
name="jawaban"
value="${p}">

${p}

</label>

`).join("")}

<button onclick="lanjutSoal()">

Lanjut

</button>

</div>

`;

}



// ======================
// LANJUT SOAL
// ======================

function lanjutSoal(){

event.preventDefault();

const jawaban =
document.querySelector(
'input[name="jawaban"]:checked'
);

if(!jawaban){

alert(
"Pilih jawaban terlebih dahulu!"
);

return;

}

if(
jawaban.value ===
soalData[nomorSoal].jawaban
){

benar++;

}

nomorSoal++;

if(
nomorSoal <
soalData.length
){

tampilkanSoal();

}else{

selesaiQuiz();

}

}



// ======================
// HASIL QUIZ
// ======================

function selesaiQuiz(){

const nilai =
Math.round(
(benar / soalData.length) * 100
);

quizForm.innerHTML = `

<div class="hasil">

<h2>
Quiz Selesai
</h2>

<div class="nilai">

${nilai}

</div>

<p>

${nilai >= 70

? "🎉 Selamat kamu lulus"

: "❌ Nilai kurang dari 70"}

</p>

${
nilai < 70

?

`

<button
class="ulang"
onclick="location.reload()">

Kerjakan Ulang

</button>

`

: ""

}

</div>

`;



// ======================
// GOOGLE SHEET
// ======================

const data = {

nama:nama,

kelas:kelas,

mapel:"Matematika",

nilai:nilai,

benar:benar,

tanggal:
new Date()
.toLocaleString()

};

fetch(
"https://script.google.com/macros/s/AKfycbwfOsYej4iHwZoYgFLOIoqew2KisHcRtWVVO_WaHZGfDAGWCrSvpNSgFGH2JAcbOKo/exec",
{

method:"POST",

body:JSON.stringify(data)

}

);

}

</script>
