const quizForm = document.getElementById("quizForm");

soalData.forEach((data,index)=>{

let html = `
<div class="soal">
<h3>${data.soal}</h3>
`;

data.pilihan.forEach(p=>{

html += `
<label>
<input type="radio" name="soal${index}" value="${p}">
${p}
</label>
`;

});

html += `</div>`;

quizForm.innerHTML += html;

});

async function koreksiSoal(){

let benar = 0;

soalData.forEach((data,index)=>{

const jawaban =
document.querySelector(`input[name="soal${index}"]:checked`);

if(jawaban && jawaban.value === data.jawaban){
benar++;
}

});

const nilai =
Math.round((benar / soalData.length) * 100);

document.getElementById("hasilBox").style.display = "block";

document.getElementById("nilai").innerHTML = nilai;

if(nilai >= 70){

document.getElementById("keterangan").innerHTML =
"🎉 Selamat kamu lulus";

document.getElementById("ulangBtn").style.display = "none";

}else{

document.getElementById("keterangan").innerHTML =
"❌ Nilai kurang dari 70, silakan ulangi";

document.getElementById("ulangBtn").style.display = "block";

}

window.scrollTo(0,document.body.scrollHeight);



// ===========================
// KIRIM KE GOOGLE SHEET
// ===========================

const data = {

nama:
localStorage.getItem("namaSiswa") || "Tidak Ada",

kelas:
localStorage.getItem("kelasSiswa") || "Tidak Ada",

nilai:nilai,

benar:benar,

tanggal:new Date().toLocaleString()

};

fetch("LINK_WEB_APP_SCRIPT",{

method:"POST",

body:JSON.stringify(data)

});

}

function ulangSoal(){

location.reload();

}

</script>
