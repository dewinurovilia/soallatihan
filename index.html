<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CBT Online</title>

<style>

body{
    font-family:Arial;
    background:#f3f4f6;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

.question{
    border:1px solid #ddd;
    padding:15px;
    margin-bottom:20px;
    border-radius:10px;
}

button{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    width:100%;
    font-size:16px;
}

button:hover{
    background:#1d4ed8;
}

#timer{
    position:fixed;
    top:10px;
    right:10px;
    background:red;
    color:white;
    padding:10px 15px;
    border-radius:10px;
    font-weight:bold;
}

#examPage{
    display:none;
}

#result{
    display:none;
    margin-top:20px;
    background:#ecfdf5;
    padding:15px;
    border-radius:10px;
}

input{
    width:100%;
    padding:10px;
    margin-bottom:15px;
    border-radius:8px;
    border:1px solid #ccc;
    box-sizing:border-box;
}

</style>
</head>

<body>

<div id="timer">30:00</div>

<div class="container">

<div id="loginPage">

<h1>Login Peserta</h1>

<input type="text" id="nama" placeholder="Nama Peserta">

<input type="text" id="kelas" placeholder="Kelas">

<button id="startBtn">Mulai Ujian</button>

</div>

<div id="examPage">

<h1>Ujian Online</h1>

<div id="quiz"></div>

<button onclick="submitQuiz()">Kirim Jawaban</button>

<div id="result"></div>

</div>

</div>

<!-- LOAD FILE SOAL -->
<script src="soal.js"></script>

<script>

let duration = 30 * 60;
let timerInterval;

// CEK FILE SOAL
if(typeof questions === "undefined"){

    alert("File soal.js tidak terbaca!");

}

// TOMBOL START
document
.getElementById("startBtn")
.addEventListener("click", startExam);

// MULAI UJIAN
function startExam(){

    const nama =
        document.getElementById("nama").value;

    const kelas =
        document.getElementById("kelas").value;

    if(nama === "" || kelas === ""){

        alert("Nama dan kelas wajib diisi");

        return;

    }

    questions = shuffleArray(questions);

    document.getElementById("loginPage").style.display = "none";

    document.getElementById("examPage").style.display = "block";

    loadQuiz();

    startTimer();

}

// ACAK SOAL
function shuffleArray(array){

    for(let i = array.length - 1; i > 0; i--){

        const j = Math.floor(Math.random() * (i + 1));

        [array[i], array[j]] =
        [array[j], array[i]];

    }

    return array;

}

// LOAD QUIZ
function loadQuiz(){

    const quiz =
        document.getElementById("quiz");

    quiz.innerHTML = "";

    questions.forEach((q,index)=>{

        quiz.innerHTML += `

        <div class="question">

            <h3>${index+1}. ${q.soal}</h3>

            <label>
                <input type="radio"
                name="q${index}"
                value="A">

                ${q.opsiA}
            </label>

            <br><br>

            <label>
                <input type="radio"
                name="q${index}"
                value="B">

                ${q.opsiB}
            </label>

            <br><br>

            <label>
                <input type="radio"
                name="q${index}"
                value="C">

                ${q.opsiC}
            </label>

            <br><br>

            <label>
                <input type="radio"
                name="q${index}"
                value="D">

                ${q.opsiD}
            </label>

        </div>

        `;

    });

}

// TIMER
function startTimer(){

    let time = duration;

    timerInterval = setInterval(()=>{

        let minutes =
            Math.floor(time / 60);

        let seconds =
            time % 60;

        minutes =
            minutes < 10
            ? "0"+minutes
            : minutes;

        seconds =
            seconds < 10
            ? "0"+seconds
            : seconds;

        document
        .getElementById("timer")
        .innerHTML =
        `${minutes}:${seconds}`;

        if(time <= 0){

            clearInterval(timerInterval);

            alert("Waktu habis!");

            submitQuiz();

        }

        time--;

    },1000);

}

// SUBMIT
function submitQuiz(){

    clearInterval(timerInterval);

    const nama =
        document.getElementById("nama").value;

    const kelas =
        document.getElementById("kelas").value;

    let benar = 0;

    let jawabanPeserta = [];

    questions.forEach((q,index)=>{

        const selected =
            document.querySelector(
            `input[name="q${index}"]:checked`
            );

        let jawaban = "-";

        if(selected){

            jawaban = selected.value;

        }

        jawabanPeserta.push(jawaban);

        if(jawaban === q.jawaban){

            benar++;

        }

    });

    const nilai =
        Math.round(
        (benar / questions.length) * 100
        );

    document
    .getElementById("result")
    .style.display = "block";

    document
    .getElementById("result")
    .innerHTML = `

        <h2>Hasil Ujian</h2>

        <p>Nama: ${nama}</p>

        <p>Kelas: ${kelas}</p>

        <p>Benar: ${benar}</p>

        <p>Nilai: ${nilai}</p>

    `;

}

</script>

</body>
</html>
