// QUIZ

let nomorSoal = 0;
let benar = 0;

const quizForm =
document.getElementById("quizForm");

tampilkanSoal();

function tampilkanSoal(){

const data = soalData[nomorSoal];

quizForm.innerHTML = `

<div class="soal">

<h3>

${data.soal}

</h3>

${data.pilihan.map(p => `

<label>

<input
type="radio"
name="jawaban"
value="${p}">

${p}

</label>

`).join("")}

<button onclick="lanjutSoal()">

Lanjut

</button>

</div>

`;

}



function lanjutSoal(){

event.preventDefault();

const jawaban =
document.querySelector(
'input[name="jawaban"]:checked'
);

if(!jawaban){

alert(
"Pilih jawaban terlebih dahulu!"
);

return;

}

if(
jawaban.value ===
soalData[nomorSoal].jawaban
){

benar++;

}

nomorSoal++;

if(
nomorSoal <
soalData.length
){

tampilkanSoal();

}else{

selesaiQuiz();

}

}



function selesaiQuiz(){

const nilai =
Math.round(
(benar / soalData.length) * 100
);

quizForm.innerHTML = `

<div class="hasil">

<h2>
Quiz Selesai
</h2>

<div class="nilai">

${nilai}

</div>

<p>

${nilai >= 70

? "🎉 Selamat kamu lulus"

: "❌ Nilai kurang dari 70"}

</p>

${
nilai < 70

?

`

<button
class="ulang"
onclick="location.reload()">

Kerjakan Ulang

</button>

`

: ""

}

</div>

`;
