<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soal Informatika</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f1f5f9;
padding:20px;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

h1{
text-align:center;
margin-bottom:10px;
}

.info{
text-align:center;
margin-bottom:20px;
color:#64748b;
}

.infoSiswa{
background:#eff6ff;
padding:15px;
border-radius:15px;
margin-bottom:20px;
text-align:center;
}

.soal{
padding:20px;
border:1px solid #cbd5e1;
border-radius:15px;
margin-top:20px;
}

.soal h3{
margin-bottom:20px;
line-height:1.5;
}

label{
display:block;
padding:12px;
background:#f8fafc;
border-radius:10px;
margin-bottom:12px;
cursor:pointer;
}

button{
width:100%;
padding:15px;
background:#2563eb;
color:white;
border:none;
border-radius:12px;
font-size:16px;
cursor:pointer;
margin-top:20px;
}

.hasil{
text-align:center;
padding:30px;
}

.nilai{
font-size:60px;
font-weight:bold;
color:#2563eb;
margin:20px 0;
}

.ulang{
background:#dc2626;
}

</style>
</head>

<body>

<div class="container">

<h1>💻 Informatika Kelas 5</h1>

<div class="info">
Semester 2 • Literasi Digital • 50 Soal
</div>

<div class="infoSiswa">

<h2 id="namaSiswa"></h2>

<h3 id="kelasSiswa"></h3>

</div>

<form id="quizForm"></form>

</div>

<script>

const nama =
localStorage.getItem("namaSiswa")
|| "Siswa";

const kelas =
localStorage.getItem("kelasSiswa")
|| "Kelas";

document.getElementById("namaSiswa")
.innerHTML =
"👤 " + nama;

document.getElementById("kelasSiswa")
.innerHTML =
"🏫 " + kelas;



const soalData = [

{
soal:"1. Komputer digunakan untuk...",
pilihan:[
"Bermain saja",
"Mengolah data",
"Memasak",
"Mencuci"
],
jawaban:"Mengolah data"
},

{
soal:"2. Perangkat untuk mengetik disebut...",
pilihan:[
"Mouse",
"Keyboard",
"Monitor",
"Printer"
],
jawaban:"Keyboard"
},

{
soal:"3. Tombol untuk menghapus tulisan adalah...",
pilihan:[
"Enter",
"Shift",
"Backspace",
"Ctrl"
],
jawaban:"Backspace"
},

{
soal:"4. Internet digunakan untuk...",
pilihan:[
"Mencari informasi",
"Memasak",
"Menyapu",
"Mengecat"
],
jawaban:"Mencari informasi"
},

{
soal:"5. Sikap yang baik saat menggunakan internet adalah...",
pilihan:[
"Menyebar hoaks",
"Berkata kasar",
"Sopan",
"Menghina"
],
jawaban:"Sopan"
}

];



// ======================
// TAMBAH SOAL OTOMATIS
// ======================

for(let i=6;i<=50;i++){

soalData.push({

soal:i + ". Contoh penggunaan internet yang baik adalah...",

pilihan:[
"Belajar online",
"Menyebar berita bohong",
"Membully teman",
"Mencuri akun"
],

jawaban:"Belajar online"

});

}



// ======================
// QUIZ
// ======================

let nomorSoal = 0;
let benar = 0;

const quizForm =
document.getElementById("quizForm");

tampilkanSoal();

function tampilkanSoal(){

const data = soalData[nomorSoal];

quizForm.innerHTML = `

<div class="soal">

<h3>

${data.soal}

</h3>

${data.pilihan.map(p => `

<label>

<input
type="radio"
name="jawaban"
value="${p}">

${p}

</label>

`).join("")}

<button onclick="lanjutSoal()">

Lanjut

</button>

</div>

`;

}



function lanjutSoal(){

event.preventDefault();

const jawaban =
document.querySelector(
'input[name="jawaban"]:checked'
);

if(!jawaban){

alert(
"Pilih jawaban terlebih dahulu!"
);

return;

}

if(
jawaban.value ===
soalData[nomorSoal].jawaban
){

benar++;

}

nomorSoal++;

if(
nomorSoal <
soalData.length
){

tampilkanSoal();

}else{

selesaiQuiz();

}

}



function selesaiQuiz(){

const nilai =
Math.round(
(benar / soalData.length) * 100
);

quizForm.innerHTML = `

<div class="hasil">

<h2>
Quiz Selesai
</h2>

<div class="nilai">

${nilai}

</div>

<p>

${nilai >= 70

? "🎉 Selamat kamu lulus"

: "❌ Nilai kurang dari 70"}

</p>

${
nilai < 70

?

`

<button
class="ulang"
onclick="location.reload()">

Kerjakan Ulang

</button>

`

: ""

}

</div>

`;



// ======================
// KIRIM GOOGLE SHEET
// ======================

const data = {

nama:nama,

kelas:kelas,

mapel:"Informatika",

nilai:nilai,

benar:benar,

tanggal:
new Date()
.toLocaleString()

};

fetch(
"https://script.google.com/macros/s/AKfycbwfOsYej4iHwZoYgFLOIoqew2KisHcRtWVVO_WaHZGfDAGWCrSvpNSgFGH2JAcbOKo/exec",
{

method:"POST",

body:JSON.stringify(data)

}

);

}

</script>

</body>
</html>
