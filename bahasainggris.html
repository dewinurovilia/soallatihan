<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bahasa Inggris SD</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f1f5f9;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.container{
width:100%;
max-width:500px;
background:white;
padding:35px;
border-radius:20px;
box-shadow:0 5px 20px rgba(0,0,0,0.15);
}

h1{
text-align:center;
color:#1e293b;
margin-bottom:10px;
}

p{
text-align:center;
color:#64748b;
margin-bottom:25px;
}

.input-group{
margin-bottom:20px;
}

label{
display:block;
margin-bottom:8px;
font-weight:bold;
}

input,
select{
width:100%;
padding:14px;
border:1px solid #cbd5e1;
border-radius:12px;
font-size:16px;
}

button{
width:100%;
padding:15px;
background:#2563eb;
color:white;
border:none;
border-radius:12px;
font-size:16px;
cursor:pointer;
margin-top:10px;
}

button:hover{
background:#1d4ed8;
}

</style>
</head>

<body>

<div class="container">

<h1>🇬🇧 Bahasa Inggris SD</h1>

<p>
Silakan isi data sebelum mengerjakan soal
</p>

<div class="input-group">

<label>Nama Siswa</label>

<input
type="text"
id="nama"
placeholder="Masukkan nama lengkap">

</div>

<div class="input-group">

<label>Pilih Kelas</label>

<select id="kelas">

<option value="">
-- Pilih Kelas --
</option>

<option>Kelas 1</option>
<option>Kelas 2</option>
<option>Kelas 3</option>
<option>Kelas 4</option>
<option selected>Kelas 5</option>
<option>Kelas 6</option>

</select>

</div>

<button onclick="mulaiBelajar()">

Mulai Soal

</button>

</div>

<script>

function mulaiBelajar(){

const nama =
document.getElementById("nama").value;

const kelas =
document.getElementById("kelas").value;

if(
nama === "" ||
kelas === ""
){

alert(
"Isi nama dan pilih kelas!"
);

return;

}

localStorage.setItem(
"namaSiswa",
nama
);

localStorage.setItem(
"kelasSiswa",
kelas
);

window.location.href =
"soal-bahasa-inggris.html";

}

</script>

</body>
</html>
